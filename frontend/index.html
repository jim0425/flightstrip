<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FlightStrip - Free Pilot Kneeboard Generator</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .mono { font-family: 'Courier New', Courier, monospace; }
    @media print {
      .no-print { display: none !important; }
      .print-header { display: block !important; }
      .expand-detail { display: table-row !important; }
      @page { size: 8.5in 5.5in landscape; margin: 0.25in; }
      body { font-size: 9pt; }
      table { font-size: 9pt; width: 100%; border-collapse: collapse; }
      thead th {
        background: #000 !important; color: #fff !important; font-size: 8pt;
        padding: 2px 4px;
        -webkit-print-color-adjust: exact; print-color-adjust: exact;
      }
      tbody td { padding: 2px 4px; border-bottom: 0.5pt solid #ccc; }
      tbody tr:nth-child(even) td {
        background: #f5f5f5 !important;
        -webkit-print-color-adjust: exact; print-color-adjust: exact;
      }
      .wx-badge { font-weight: bold; }
      .freq-badge { background: none !important; padding: 0; }
    }
  </style>
  <!-- SET window.FLIGHTSTRIP_API_URL = "https://your-railway-url.up.railway.app" for production -->
</head>
<body class="bg-gray-50 min-h-screen">
<div id="root"></div>
<script type="text/babel">
const API_BASE = window.FLIGHTSTRIP_API_URL
  || (location.hostname === "localhost" || location.hostname === "127.0.0.1" || location.hostname === ""
      ? "http://localhost:8000"
      : "https://flightstrip-api.up.railway.app");

const WX_STYLE = {
  VFR:     { bg: "bg-green-100 text-green-800",   label: "VFR"  },
  MVFR:    { bg: "bg-blue-100 text-blue-800",     label: "MVFR" },
  IFR:     { bg: "bg-red-100 text-red-800",       label: "IFR"  },
  LIFR:    { bg: "bg-purple-100 text-purple-800", label: "LIFR" },
  UNKNOWN: { bg: "bg-gray-100 text-gray-500",     label: "?"    },
};

function WxBadge({ category }) {
  const s = WX_STYLE[category] || WX_STYLE.UNKNOWN;
  return <span className={`wx-badge inline-block px-1.5 py-0.5 rounded text-xs font-bold ${s.bg}`}>{s.label}</span>;
}

function FreqChip({ freq_type, frequency, compact }) {
  const t = (freq_type || '').toUpperCase();
  const isCtaf = ['CTAF','UNICOM','UNIC'].includes(t);
  const isAtis = ['ATIS','AWOS','ASOS'].includes(t);
  const cls = isCtaf
    ? "bg-yellow-100 text-yellow-900 border border-yellow-300"
    : isAtis ? "bg-blue-100 text-blue-800 border border-blue-200"
    : "bg-gray-100 text-gray-700 border border-gray-200";
  return (
    <span className={`freq-badge inline-block px-1.5 py-0.5 rounded text-xs mono mr-1 mb-0.5 ${cls}`}>
      {compact ? frequency : `${freq_type} ${frequency}`}
    </span>
  );
}

function longestRunway(runways) {
  if (!runways || !runways.length) return null;
  return runways.reduce((best, r) => (!best || (r.length_ft||0) > (best.length_ft||0)) ? r : best, null);
}

function surfaceAbbr(surface) {
  if (!surface) return '\u2014';
  const s = surface.toUpperCase();
  if (s.includes('ASPH')) return 'ASPH';
  if (s.includes('CONC')) return 'CONC';
  if (s.includes('TURF')) return 'TURF';
  if (s.includes('GRVL')||s.includes('GRAV')) return 'GRVL';
  if (s.includes('DIRT')) return 'DIRT';
  return surface.slice(0,4).toUpperCase();
}

function DetailRow({ apt, colSpan }) {
  return (
    <tr className="expand-detail bg-blue-50 border-b border-blue-100">
      <td colSpan={colSpan} className="px-4 py-2">
        <div className="grid grid-cols-3 gap-4 text-xs">
          <div>
            <div className="font-semibold text-gray-600 mb-1">All Runways</div>
            {(apt.runways||[]).length
              ? apt.runways.map((r,i)=>(
                  <div key={i} className="mono text-gray-700">
                    {r.rwy_id}{' \u2014 '}{r.length_ft?.toLocaleString()}ft {surfaceAbbr(r.surface)} pat:{r.pattern_dir||'\u2014'} lts:{r.lighting||'\u2014'}
                  </div>
                ))
              : <span className="text-gray-400">No runway data</span>}
          </div>
          <div>
            <div className="font-semibold text-gray-600 mb-1">All Frequencies</div>
            <div className="flex flex-wrap">
              {(apt.frequencies||[]).map((f,i)=><FreqChip key={i} {...f}/>)}
              {!(apt.frequencies||[]).length && <span className="text-gray-400">None</span>}
            </div>
          </div>
          <div>
            <div className="font-semibold text-gray-600 mb-1">METAR</div>
            {apt.metar?.raw_metar && apt.metar.raw_metar!=='N/A'
              ? <div className="mono text-gray-600 text-xs break-all bg-white rounded p-1">{apt.metar.raw_metar}</div>
              : <span className="text-gray-400">No METAR</span>}
            {apt.airspace_class && <div className="mt-1 text-gray-600">Airspace: Class {apt.airspace_class}</div>}
          </div>
        </div>
      </td>
    </tr>
  );
}

function AirportRow({ apt, expanded, onToggle }) {
  const isHeli = apt.site_type === 'H';
  const lr = longestRunway(apt.runways||[]);
  const cat = apt.metar?.flight_category || 'UNKNOWN';
  const rowCls = isHeli
    ? "cursor-pointer italic text-gray-400 hover:bg-gray-50"
    : "cursor-pointer hover:bg-blue-50 transition-colors";
  const COL_COUNT = 10;
  const primaryFreq = apt.freq_ctaf_tower;
  const isTowered = apt.is_towered;

  return (
    <>
      <tr className={rowCls} onClick={onToggle}>
        <td className="px-2 py-1 whitespace-nowrap">
          <span className="mono font-bold text-blue-700 text-sm">{apt.icao}</span>
          {isHeli && <span className="ml-1 text-xs bg-gray-200 text-gray-600 rounded px-1">HELI</span>}
        </td>
        <td className="px-2 py-1 max-w-[160px]">
          <div className="truncate text-xs text-gray-800" title={`${apt.name} \u2014 ${apt.city}, ${apt.state}`}>
            {apt.name_abbrev || apt.name?.slice(0,18)}{(!apt.name_abbrev && apt.name?.length>18)?'\u2026':''}{' '}
            <span className="text-gray-400">{apt.city_abbrev || apt.city?.slice(0,10)}</span>
          </div>
        </td>
        <td className="px-2 py-1 text-right text-xs mono text-gray-600 whitespace-nowrap">{apt.along_track_nm}nm</td>
        <td className="px-2 py-1 text-xs mono text-gray-700 whitespace-nowrap">
          {apt.elevation_ft?.toLocaleString()}{apt.tpa_ft?`\u2191${apt.tpa_ft.toLocaleString()}`:''}
        </td>
        <td className="px-2 py-1 text-xs mono text-gray-700 whitespace-nowrap">
          {lr ? `${lr.rwy_id} ${lr.length_ft?.toLocaleString()}'` : '\u2014'}
        </td>
        <td className="px-2 py-1 text-xs mono text-gray-600">{lr?surfaceAbbr(lr.surface):'\u2014'}</td>
        <td className="px-2 py-1 text-xs mono text-center text-gray-600">{lr?.pattern_dir||'\u2014'}</td>
        <td className="px-2 py-1 whitespace-nowrap">
          {primaryFreq
            ? <span className={`inline-block px-1.5 py-0.5 rounded text-xs mono font-bold border ${isTowered ? 'bg-blue-100 text-blue-800 border-blue-300' : 'bg-yellow-100 text-yellow-900 border-yellow-300'}`}>{primaryFreq}</span>
            : <span className="text-gray-300 text-xs">&mdash;</span>}
        </td>
        <td className="px-2 py-1 whitespace-nowrap">
          {apt.freq_atis
            ? <span className="inline-block px-1.5 py-0.5 rounded text-xs mono border bg-blue-100 text-blue-800 border-blue-200">{apt.freq_atis}</span>
            : <span className="text-gray-300 text-xs">&mdash;</span>}
        </td>
        <td className="px-2 py-1"><WxBadge category={cat}/></td>
      </tr>
      {expanded && <DetailRow apt={apt} colSpan={COL_COUNT}/>}
    </>
  );
}

function WaypointInputs({ waypoints, setWaypoints }) {
  const addStop = () => { if (waypoints.length < 4) setWaypoints([...waypoints, ""]); };
  const removeStop = (i) => { if (waypoints.length > 2) setWaypoints(waypoints.filter((_,idx)=>idx!==i)); };
  const updateStop = (i, val) => {
    const next = [...waypoints];
    next[i] = val.toUpperCase().slice(0,4);
    setWaypoints(next);
  };
  return (
    <div className="flex items-center gap-1 flex-wrap">
      {waypoints.map((wp, i) => (
        <React.Fragment key={i}>
          {i > 0 && <span className="text-gray-400 font-bold text-lg">&#8594;</span>}
          <div className="relative">
            <input
              value={wp}
              onChange={e=>updateStop(i,e.target.value)}
              className="border rounded px-2 py-1.5 w-20 text-center mono font-bold text-base uppercase focus:outline-none focus:ring-2 focus:ring-blue-400"
              maxLength={4}
              placeholder={i===0?"From":i===waypoints.length-1?"To":`Via ${i}`}
            />
            {waypoints.length > 2 && i > 0 && i < waypoints.length-1 && (
              <button onClick={()=>removeStop(i)}
                className="absolute -top-1.5 -right-1.5 w-4 h-4 bg-red-400 text-white rounded-full text-xs flex items-center justify-center hover:bg-red-600 leading-none">
                &times;
              </button>
            )}
          </div>
        </React.Fragment>
      ))}
      {waypoints.length < 4 && (
        <button onClick={addStop}
          className="px-2 py-1.5 text-xs border border-dashed border-blue-400 text-blue-600 rounded hover:bg-blue-50">
          + Stop
        </button>
      )}
    </div>
  );
}

function RouteTable({ airports, summary, routeLabel }) {
  const [expanded, setExpanded] = React.useState({});
  const toggle = (icao) => setExpanded(prev=>({...prev,[icao]:!prev[icao]}));
  return (
    <div>
      <div className="print-header hidden text-sm font-bold border-b border-black pb-1 mb-2">
        &#9992; FlightStrip | {routeLabel} | {summary.distance_nm} nm | {new Date().toISOString().slice(0,10)}
      </div>
      <div className="no-print text-xs text-gray-500 mb-2 flex gap-4">
        <span>{summary.total_airports} airports</span>
        <span>{summary.distance_nm} nm</span>
        <span>Corridor: {summary.corridor_nm} nm</span>
        <span>Click row to expand</span>
      </div>
      <div className="overflow-x-auto rounded-lg border border-gray-200 shadow-sm">
        <table className="min-w-full text-sm">
          <thead>
            <tr className="bg-gray-800 text-white text-xs uppercase tracking-wide">
              <th className="px-2 py-2 text-left">ICAO</th>
              <th className="px-2 py-2 text-left">Name / City</th>
              <th className="px-2 py-2 text-right">Dist</th>
              <th className="px-2 py-2 text-left">Elev&#8593;TPA</th>
              <th className="px-2 py-2 text-left">RWY (longest)</th>
              <th className="px-2 py-2 text-left">Surf</th>
              <th className="px-2 py-2 text-center">Pat</th>
              <th className="px-2 py-2 text-left">Freq</th>
              <th className="px-2 py-2 text-left">ATIS</th>
              <th className="px-2 py-2 text-left">WX</th>
            </tr>
          </thead>
          <tbody className="divide-y divide-gray-100 bg-white">
            {airports.map((apt,i)=>(
              <AirportRow key={apt.icao} apt={apt} expanded={!!expanded[apt.icao]} onToggle={()=>toggle(apt.icao)}/>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function App() {
  const [waypoints, setWaypoints] = React.useState(["KBJC","KSUN"]);
  const [corridor, setCorridor]   = React.useState(25);
  const [publicOnly, setPublicOnly]       = React.useState(true);
  const [excludeHelis, setExcludeHelis]   = React.useState(true);
  const [minRunway, setMinRunway]         = React.useState(0);
  const [loading, setLoading]     = React.useState(false);
  const [error, setError]         = React.useState(null);
  const [result, setResult]       = React.useState(null);
  const [pdfLoading, setPdfLoading] = React.useState(false);

  const buildBody = () => ({
    waypoints: waypoints.filter(w=>w.length>=3),
    corridor_nm: corridor,
    exclude_heliports: excludeHelis,
    public_only: publicOnly,
    min_runway_ft: minRunway
  });

  async function generateRoute() {
    const body = buildBody();
    if (body.waypoints.length < 2) { setError("Enter at least 2 airports"); return; }
    setLoading(true); setError(null); setResult(null);
    try {
      const resp = await fetch(`${API_BASE}/route`, {
        method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)
      });
      if (!resp.ok) {
        const err = await resp.json().catch(()=>({detail:resp.statusText}));
        const detail = Array.isArray(err.detail)
          ? err.detail.map(e => `${e.loc?.slice(-1)[0]}: ${e.msg}`).join('; ')
          : (err.detail || resp.statusText);
        throw new Error(detail);
      }
      setResult(await resp.json());
    } catch(e) { setError(e.message); }
    finally { setLoading(false); }
  }

  async function downloadPdf() {
    if (!result) return;
    setPdfLoading(true);
    try {
      const resp = await fetch(`${API_BASE}/route/pdf`, {
        method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(buildBody())
      });
      if (!resp.ok) throw new Error("PDF generation failed");
      const contentType = resp.headers.get('content-type')||'';
      const blob = await resp.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const label = waypoints.filter(w=>w.length>=3).join('-');
      a.href=url; a.download=`${label}-kneeboard.${contentType.includes('pdf')?'pdf':'html'}`;
      a.click(); URL.revokeObjectURL(url);
    } catch(e) { window.print(); }
    finally { setPdfLoading(false); }
  }

  const routeLabel = result?.route_label || waypoints.filter(w=>w.length>=3).join(' \u2192 ');

  return (
    <div className="max-w-6xl mx-auto px-4 py-4">
      <header className="no-print flex items-center justify-between mb-4">
        <div>
          <h1 className="text-2xl font-bold text-blue-800">&#9992; FlightStrip</h1>
          <p className="text-xs text-gray-400">Free pilot kneeboard generator</p>
        </div>
      </header>

      <div className="no-print bg-white rounded-lg border border-gray-200 shadow-sm p-4 mb-4">
        <div className="flex flex-wrap gap-3 items-end">
          <div>
            <label className="block text-xs font-semibold text-gray-500 mb-1">Route (2&#8211;4 stops)</label>
            <WaypointInputs waypoints={waypoints} setWaypoints={setWaypoints}/>
          </div>
          <div>
            <label className="block text-xs font-semibold text-gray-500 mb-1">Corridor: {corridor}nm</label>
            <input type="range" min={5} max={50} value={corridor} onChange={e=>setCorridor(Number(e.target.value))} className="w-28 mt-1"/>
          </div>
          <button onClick={generateRoute} disabled={loading}
            className="px-4 py-1.5 bg-blue-700 text-white rounded font-semibold text-sm hover:bg-blue-800 disabled:opacity-50">
            {loading?"Loading\u2026":"Generate Route"}
          </button>
          <button onClick={downloadPdf} disabled={!result||pdfLoading}
            className="px-4 py-1.5 bg-gray-700 text-white rounded font-semibold text-sm hover:bg-gray-800 disabled:opacity-40">
            {pdfLoading?"Generating\u2026":"\u2b07 Kneeboard PDF"}
          </button>
        </div>
        <div className="flex flex-wrap gap-4 mt-3 pt-3 border-t border-gray-100 text-xs text-gray-600">
          <label className="flex items-center gap-1.5 cursor-pointer">
            <input type="checkbox" checked={publicOnly} onChange={e=>setPublicOnly(e.target.checked)} className="w-3.5 h-3.5"/>
            Public use only
          </label>
          <label className="flex items-center gap-1.5 cursor-pointer">
            <input type="checkbox" checked={excludeHelis} onChange={e=>setExcludeHelis(e.target.checked)} className="w-3.5 h-3.5"/>
            Exclude heliports
          </label>
          <label className="flex items-center gap-1.5 cursor-pointer">
            Min runway:
            <input type="number" value={minRunway} onChange={e=>setMinRunway(Number(e.target.value)||0)}
              className="border rounded px-1.5 py-0.5 w-16 text-xs mono ml-1" min={0} step={500} placeholder="0"/>
            ft
          </label>
        </div>
      </div>

      {loading && <div className="text-center py-10 text-gray-400 text-sm">Fetching route and live weather&hellip;</div>}
      {error && <div className="bg-red-50 border border-red-200 rounded p-3 text-red-700 text-sm mb-4"><strong>Error:</strong> {error}</div>}
      {result && <RouteTable airports={result.route} summary={result.summary} routeLabel={routeLabel}/>}

      <footer className="no-print text-center text-xs text-gray-300 mt-8 pb-6">
        Data: FAA NASR + aviationweather.gov | Updated every 28 days | Free for all pilots
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
